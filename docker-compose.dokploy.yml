services:
  openwa:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: openwa-api

    restart: unless-stopped
    stop_grace_period: 45s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    read_only: true

    tmpfs:
      - /tmp

    pids_limit: ${OPENWA_PIDS_LIMIT:-2048}
    mem_limit: ${OPENWA_MEM_LIMIT:-2g}

    expose:
      - "2785"

    environment:
      NODE_ENV: production
      PORT: 2785

      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache

      LOG_LEVEL: ${LOG_LEVEL:-info}

      AUTO_START_SESSIONS: ${AUTO_START_SESSIONS:-true}

      DATABASE_TYPE: ${DATABASE_TYPE:-postgres}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

      DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE:-false}

      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      ENGINE_TYPE: ${ENGINE_TYPE:-whatsapp-web.js}

      SESSION_DATA_PATH: /app/data/sessions

      PUPPETEER_HEADLESS: ${PUPPETEER_HEADLESS:-true}

      PUPPETEER_ARGS: ${PUPPETEER_ARGS:---no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu}

      WWEBJS_AUTH_TIMEOUT_MS: ${WWEBJS_AUTH_TIMEOUT_MS:-120000}

      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media

      PLUGINS_DIR: /app/data/plugins
      PLUGIN_STATE_DIR: /app/data/plugin-state

      WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-10000}
      WEBHOOK_RETRY_DELAY: ${WEBHOOK_RETRY_DELAY:-5000}
      WEBHOOK_DISPATCH_CONCURRENCY: ${WEBHOOK_DISPATCH_CONCURRENCY:-16}
      WEBHOOK_DISPATCH_MAX_QUEUED: ${WEBHOOK_DISPATCH_MAX_QUEUED:-1000}

       

      BASE_URL: ${BASE_URL:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}

    volumes:
      - openwa-data:/app/data

    networks:
      - dokploy-network

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:2785/api/health/ready
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      - traefik.http.routers.openwa.rule=Host(`open-wa.ilisium.co.id`)
      - traefik.http.routers.openwa.entrypoints=websecure
      - traefik.http.routers.openwa.tls=true
      - traefik.http.routers.openwa.tls.certresolver=letsencrypt

      - traefik.http.services.openwa.loadbalancer.server.port=2785

volumes:
  openwa-data:

networks:
  dokploy-network:
    external: true
